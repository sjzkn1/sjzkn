# ========================
# Clash-ALL 优化配置（广告加强 + 启动修复版）
# ========================

# ========================
# 机场节点订阅
# ========================
proxy-providers:
  N和1:
    url: "http://jia1.jiaguwei.tk:3001/CKg2abstVnOeRpm1aB4G/download/collection/%E5%A4%9A%E5%90%88%E4%B8%80"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

  公益节点:
    url: "https://xhyc.sjzkn.us.ci/CKg2abstVnOeRpm1aB4G/download/collection/%E5%85%8D%E8%B4%B9%E6%9C%BA%E5%9C%BA"
    type: http
    interval: 86400
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连

proxies:
  - {name: 直连, type: direct}
  - {name: 拒绝, type: reject}

# ========================
# 全局设置
# ========================
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
allow-lan: true
mode: rule
log-level: info
ipv6: true
external-controller: 0.0.0.0:9090
external-ui: ui
external-ui-name: zashboard
external-ui-url: https://gh-proxy.com/github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip
secret: "123456"

# ========================
# DNS 设置
# ========================
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - 192.168.3.1
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - geosite:cn
    - +.ynhtbank.com
    - +.qeayr.cn
    - +.saojc.xyz
    - +.sssyun.xyz
    - +.dler.cloud
    - +.aerianas.top
    - +.gptacg.top
    - +.wxda.net

# ========================
# TUN 模块
# ========================
tun:
  enable: true
  stack: gvisor
  device: utun
  endpoint-independent-nat: true
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  mtu: 9000

profile:
  store-selected: true
  store-fake-ip: true

# ========================
# 策略组（保留你原来的结构）
# ========================
default: &default
  type: select
  proxies:
    - 所有-自动
    - 所有-手动
    - 直连
    - 其他-故转
    - 拒绝

proxy-groups:
  # 其他组
  - name: 其他-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 其他-手动
      - 其他-自动
  - name: 其他-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"
  - name: 其他-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^((?!(直连|拒绝)).)*$"

  # 业务分流组
  - name: 所有-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 所有-手动
      - 所有-自动
  - name: 所有-手动
    type: select
    include-all: true
    filter: "^((?!(直连|拒绝)).)*$"
  - name: 所有-自动
    type: url-test
    include-all: true
    tolerance: 50
    interval: 300
    filter: "^((?!(直连|拒绝)).)*$"

  # 独立应用组
  - name: 电报
    type: select
    include-all: true
    proxies:
      - 所有-自动
      - 所有-手动

  - name: 推特
    type: select
    include-all: true
    proxies:
      - 所有-自动
      - 所有-手动

  # 其他应用使用默认锚点
  - {name: 人工智能, <<: *default}
  - {name: GitHub, <<: *default}
  - {name: 油管, <<: *default}
  - {name: 谷歌, <<: *default}
  - {name: 网络测速, <<: *default}
  - {name: 广告拦截, <<: *default}
  - {name: 国外, <<: *default}
  - {name: 国内, <<: *default}
  - {name: 其他, <<: *default}

# ========================
# 规则引擎
# ========================
rules:
  # 高优先级直连
  - DOMAIN-SUFFIX,api.cloudflare.com,直连
  - DOMAIN-SUFFIX,cloudflare.com,直连
  - DOMAIN-SUFFIX,cloudflared.com,直连
  - DOMAIN-SUFFIX,cfargotunnel.com,直连
  - DOMAIN-SUFFIX,www.zhipin.com,直连
  - DOMAIN-SUFFIX,*.sjzkn1.cf,直连
  - DOMAIN-SUFFIX,*.jiaguwei.tk,直连
  - DOMAIN-SUFFIX,*.sjzkn1.tk,直连

  # 强力广告拦截（置顶）
  - RULE-SET,秋风广告,广告拦截

  # 业务规则
  - RULE-SET,TEST / Domain,网络测速
  - RULE-SET,广告拦截 / Domain,广告拦截
  - RULE-SET,人工智能 / Domain,人工智能
  - RULE-SET,GitHub / Domain,GitHub
  - RULE-SET,电报 / Domain,电报
  - RULE-SET,电报 / IP,电报,no-resolve
  - RULE-SET,推特 / Domain,推特
  - RULE-SET,油管 / Domain,油管
  - RULE-SET,谷歌 / Domain,谷歌
  - RULE-SET,谷歌 / IP,谷歌,no-resolve
  - RULE-SET,Proxy / Domain,国外
  - RULE-SET,Globe / Domain,国外
  - RULE-SET,Direct / Domain,国内
  - RULE-SET,China / Domain,国内
  - RULE-SET,China / IP,国内,no-resolve
  - RULE-SET,Private / Domain,国内
  - MATCH,其他

# ========================
# 规则集提供者
# ========================
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}

rule-providers:
  # 原有规则集
